CONFIG_AMEBA_RIVER_EN=y
CONFIG_RIVER_ORVIBO_CLIENT_EN=y
CONFIG_AUDIO_FWK_MENU=y
CONFIG_AUDIO_PASSTHROUGH_MENU=y
CONFIG_TFLITE_MICRO_EN_MENU=y
CONFIG_RIVER_DIAG_CMD_EN=y
# Keep board audio echo loopback/debug code out of the prep branch unless a
# dedicated audio-debug session explicitly needs it.
# CONFIG_RIVER_AUDIO_ECHO_DEBUG_EN is not set
CONFIG_RIVER_LOG_LEVEL_INFO=y
# VAD is owned by river_orvibo_audio_service on this branch.
# CONFIG_RIVER_VAD_PROBE_AUTOSTART is not set
# CONFIG_RIVER_VAD_PROBE_DIAG_DEFAULT_ON is not set
CONFIG_RIVER_VOICE_PREPROC_FIXED_DSB=y
CONFIG_RIVER_WEBRTC_AECM_EXPERIMENT_EN=y
CONFIG_RIVER_VOICE_PREPROC_PROFILE_FIXED_DSB_WEBRTC_AECM=y
CONFIG_RIVER_VOICE_DSB_SECONDARY_DELAY_SAMPLES=0
CONFIG_RIVER_WEBRTC_AECM_ECHO_MODE=4
CONFIG_RIVER_WEBRTC_AECM_DELAY_MS=40
CONFIG_RIVER_WEBRTC_AECM_REF_ENTER_PEAK=128
CONFIG_RIVER_WEBRTC_AECM_REF_EXIT_PEAK=64
CONFIG_RIVER_WEBRTC_AECM_REF_STABLE_FRAMES=3
CONFIG_RIVER_WEBRTC_AECM_REF_HANGOVER_FRAMES=8
CONFIG_RIVER_WEBRTC_AECM_REF_ACTIVE_WINDOW_FRAMES=8
CONFIG_RIVER_VOICE_DETECTOR_SILERO_VAD=y
CONFIG_RIVER_SILERO_VAD_TENSOR_ARENA_KB=192
CONFIG_RIVER_SILERO_VAD_SPEECH_THRESHOLD_Q15=8000
CONFIG_RIVER_SILERO_VAD_SILENCE_THRESHOLD_Q15=2500
# Keep the wake gate open longer through short syllable gaps so the slower FP32
# board path has time to score more than one aligned window per utterance.
CONFIG_RIVER_SILERO_VAD_HANGOVER_FRAMES=18
CONFIG_RIVER_SILERO_VAD_EMA_SHIFT=1
CONFIG_RIVER_VOICE_CAPABILITY_KWS=y
# Switch the active deployment test to the teacher-a refreshed nano FP32 debug
# variant that keeps the same `40x101` frontend / resolver path as nano v1.
# CONFIG_RIVER_KWS_MODEL_VARIANT_BASELINE is not set
# CONFIG_RIVER_KWS_MODEL_VARIANT_FP32_EXPERIMENTAL is not set
# CONFIG_RIVER_KWS_MODEL_VARIANT_ROUND6_TARGETED_EXPERIMENTAL is not set
# CONFIG_RIVER_KWS_MODEL_VARIANT_STUDENT_BC_RESNET_NANO_V2_FP32_DEBUG is not set
# CONFIG_RIVER_KWS_MODEL_VARIANT_STUDENT_DSCNN_TINY_V2_FP32_DEBUG is not set
# CONFIG_RIVER_KWS_MODEL_VARIANT_STUDENT_DSCNN_SMALL_V2_FP32_DEBUG is not set
# CONFIG_RIVER_KWS_MODEL_VARIANT_STUDENT_CONV_RESNET_ED_NANO_V1_FP32_DEBUG is not set
CONFIG_RIVER_KWS_MODEL_VARIANT_STUDENT_CONV_RESNET_ED_NANO_CURRENT_TEACHER_A_V2_FP32_DEBUG=y
# CONFIG_RIVER_KWS_MODEL_VARIANT_STUDENT_CONV_RESNET_ED_TINY_V1_FP32_DEBUG is not set
# CONFIG_RIVER_KWS_MODEL_VARIANT_STUDENT_CONV_RESNET_ED_TINY_V1_INT8_DEBUG is not set
# CONFIG_RIVER_KWS_MODEL_VARIANT_STUDENT_BC_RESNET_TINY_V2_FP32_DEBUG is not set
# CONFIG_RIVER_KWS_MODEL_VARIANT_STUDENT_BC_RESNET_TINY_V2_INT8_DEBUG is not set
# Keep legacy-only KWS operator compatibility out of the prep branch. Re-enable
# only when an older MEAN/FC model needs to be brought up again.
CONFIG_RIVER_KWS_LEGACY_MODEL_COMPAT_EN=n
# Keep the temporary patched MEAN path out of the prep branch. If a legacy
# model still needs it, re-enable explicitly on that troubleshooting branch.
CONFIG_RIVER_KWS_MEAN_PATCH_EN=n
# Keep the same 2MB arena used by the current `40x101` debug profiles so the
# nano FP32 measurement stays comparable to the recent conv/dscnn reports.
CONFIG_RIVER_KWS_TENSOR_ARENA_KB=2048
# Restore the KWS threshold from the temporary debug-low setting to the
# calibrated default-target-recall neighborhood for the current teacher-a nano
# candidate (`~9517 q15` from the deployment bundle).
CONFIG_RIVER_KWS_SCORE_THRESHOLD_Q15=9517
CONFIG_RIVER_KWS_TRIGGER_HOLD_FRAMES=1
CONFIG_RIVER_KWS_COOLDOWN_MS=1800
# Peak-triggered KWS logs now provide immediate visibility, so slow the
# periodic heartbeat to reduce background serial noise.
CONFIG_RIVER_KWS_LOG_PERIOD_MS=5000
# Keep the validated stride-16 replay cadence; this preserves the existing
# parity flow and keeps the new nano run directly comparable with recent
# `40x101` student board measurements.
CONFIG_RIVER_KWS_INFERENCE_STRIDE_FRAMES=16
CONFIG_RIVER_KWS_VAD_PRE_ROLL_MS=320
# Keep the wider pre-roll flush from the previously verified FP32 deployment so
# the clean-SDK control run does not introduce a second frontend variable.
CONFIG_RIVER_KWS_PRE_ROLL_FLUSH_MAX_FRAMES=16
# Preserve the larger input queue from the working FP32 debug deployment so
# short bursts or logging spikes do not erase parity evidence.
CONFIG_RIVER_KWS_INPUT_QUEUE_FRAMES=64
CONFIG_RIVER_KWS_DIAG_VERBOSE_EN=y
# Keep the default board triage log volume manageable. If repeated-pattern
# logs are still insufficient, temporarily enable every-inference logging.
# CONFIG_RIVER_KWS_DIAG_LOG_EVERY_INFER is not set
CONFIG_RIVER_VAD_PROBE_DIAG_WINDOW_MS=96
CONFIG_RIVER_VAD_PROBE_PRE_ROLL_MS=384
CONFIG_RIVER_VAD_PROBE_POST_ROLL_MS=1000
CONFIG_RIVER_VAD_PROBE_MAX_SEGMENT_MS=15000
CONFIG_RIVER_VAD_PROBE_SEGMENT_MIN_FREE_HEAP_KB=64
CONFIG_RIVER_OFFLINE_ASR_RESERVED=y
